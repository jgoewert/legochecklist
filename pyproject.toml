[project]
name = "legochecklist"
version = "0.1.0"
description = "A simple, printable checklist for pieces in a LEGO set written in Python/Django"
authors = [
    {name = "John Goewert"},
]
# Dependencies are pinned in requirements.txt and requirements-dev.txt.
# Django 6.0 needs Python 3.12 or newer. Deployments use .python-version.
requires-python = ">=3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
