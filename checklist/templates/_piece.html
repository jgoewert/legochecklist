<div class="piece{% if piece.spare %} spare{% endif %}">
  {% if piece.img %}
  <img src="{{ piece.img }}" alt="{{ piece.name }}" loading="lazy" decoding="async">
  {% else %}
  <div class="no-image">No image</div>
  {% endif %}
  <div class="piece-info">
    <div class="part-details">
      <div class="part-num"><a href="https://rebrickable.com/parts/{{ piece.num|urlencode }}/" target="_blank"
          rel="noopener" title="Open this part on Rebrickable">{{ piece.num }}</a></div>
      <div class="part-name">{{ piece.name }}</div>
      <div class="part-color">{% if piece.color_rgb %}<span class="swatch" style="background-color: #{{ piece.color_rgb }}"></span>{% endif %}{{ piece.color }}</div>
    </div>
    <div class="part-count">{{ piece.qty }}
      {% for boxes in "x"|ljust:piece.qty %}
      <span class="checkbox"><input type="checkbox"
          aria-label="{% if piece.spare %}Spare {% endif %}{{ piece.name }}, {{ piece.color }}, {{ forloop.counter }} of {{ piece.qty }}"
          data-key="{{ set_id }}:{% if piece.spare %}spare:{% endif %}{{ piece.num }}:{{ piece.color }}:{{ forloop.counter }}"
          onchange="respond_to_change(this)"></span>
      {% endfor %}
    </div>
  </div>
</div>
